
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Profile -->
        <section class="profile">
            <div class="avatar" id="avatar">S</div>

            <h1 id="name">Student Name</h1>
            <p id="major">Information Technology Student</p>

            <div class="links">
                <a id="github" href="#" target="_blank">GitHub</a>
                <a id="linkedin" href="#" target="_blank">LinkedIn</a>
            </div>
        </section>


        <!-- About Me -->
        <section class="card">
            <h2>About Me</h2>
            <p id="about">
                Write something about yourself here.
            </p>
        </section>


        <!-- Skills -->
        <section class="card">
            <h2>My Skills</h2>

            <div class="skills" id="skills">
                <!-- Skills will appear here -->
            </div>
        </section>


        <!-- Interests -->
        <section class="card">
            <h2>My Interests</h2>

            <div class="skills" id="interests">
                <!-- Interests will appear here -->
            </div>
        </section>


        <!-- Projects -->
        <section class="card">
            <h2>My Projects</h2>

            <div id="projects">
                <!-- Projects will appear here -->
            </div>
        </section>


        <!-- JavaScript Button -->
        <section class="card center">
            <button onclick="showMessage()">Click Me</button>

            <p id="message"></p>
        </section>


        <footer>
            Student Profile Project
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
